[project]
name = "content-studio"
version = "0.1.0"
description = "Narración TTS y música de fondo locales para videos, en una GPU de 8 GB."
readme = "AGENTS.md"
requires-python = ">=3.10"
# Las mismas que la cabecera PEP 723 de cli.py (tests/test_estructura.py lo comprueba).
dependencies = ["typer>=0.29", "rich>=14", "questionary>=2.1"]

[dependency-groups]
dev = ["pytest>=8", "ruff", "numpy"]

[project.scripts]
content-studio = "content_studio.cli.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/content_studio"]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["narration/motores", "music/models", "tmp", "out", "logs"]

[tool.ruff.format]
# El código usa comillas simples: sin esto, `ruff format` cambiaría todas las cadenas al activarse.
quote-style = "single"
# Los bloques de código de los .md (docs, research) se escriben a mano: no se reformatean.
exclude = ["*.md"]

[tool.ruff.lint]
# ANN001/ANN201: type hints en las firmas (regla codigo-python.md); los tests quedan fuera.
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ANN001", "ANN201"]

[tool.ruff.lint.per-file-ignores]
# Captions del catálogo: cadenas largas que ruff format no parte.
"src/content_studio/music/estilos.py" = ["E501"]
"tests/**" = ["ANN"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src", "tests"]
addopts = "--doctest-modules -m 'not local'"
markers = ["local: necesita los venvs de los motores de este equipo (no corre en CI)"]
