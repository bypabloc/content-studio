[project]
name = "content-studio"
version = "0.1.0"
description = "Narración TTS y música de fondo locales para videos, en una GPU de 8 GB."
readme = "AGENTS.md"
requires-python = ">=3.10"
# Las mismas que la cabecera PEP 723 de cli.py (tests/test_estructura.py lo comprueba).
dependencies = ["typer>=0.29", "rich>=14", "questionary>=2.1"]

[dependency-groups]
dev = ["pytest>=8", "ruff", "numpy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/content_studio"]

[tool.uv]
# Todavía no hay paquete en src/: uv sync solo instala las dependencias. Se activa cuando exista.
package = false

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["narration/motores", "music/models", "tmp", "out", "logs"]

[tool.ruff.format]
# El código usa comillas simples: sin esto, `ruff format` cambiaría todas las cadenas al activarse.
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Temporal: el código viejo se migra a src/ en los pasos siguientes del refactor y ahí se limpia.
"cli.py" = ["E501"]
"music/*.py" = ["E501", "E402"]
"narration/*.py" = ["E501", "B905", "I001", "SIM105"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--doctest-modules -m 'not local'"
markers = ["local: necesita los venvs de los motores de este equipo (no corre en CI)"]
