# Raíz del uv workspace: el paquete vive en server/ (server/pyproject.toml). Aquí van las herramientas compartidas.
[tool.uv.workspace]
members = ["server"]

[dependency-groups]
dev = ["pytest>=8", "ruff", "numpy"]

[tool.ruff]
target-version = "py310"
line-length = 120
# Los imports de server/src son de primera parte (content_studio), igual que devtools y tests.
src = [".", "server/src"]
extend-exclude = ["server/data/narration/engines", "server/data/music/models", "tmp", "out", "logs"]

[tool.ruff.format]
# El código usa comillas simples: sin esto, `ruff format` cambiaría todas las cadenas al activarse.
quote-style = "single"
# Los bloques de código de los .md (docs, research) se escriben a mano: no se reformatean.
exclude = ["*.md"]

[tool.ruff.lint]
# ANN001/ANN201: type hints en las firmas (regla codigo-python.md); los tests quedan fuera.
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ANN001", "ANN201"]

[tool.ruff.lint.per-file-ignores]
# Captions del catálogo: cadenas largas que ruff format no parte.
"server/src/content_studio/music/styles.py" = ["E501"]
"server/tests/**" = ["ANN"]
"tests/**" = ["ANN"]
"devtools/tests/**" = ["ANN"]
".agents/hooks/tests/**" = ["ANN"]
".claude/hooks/tests/**" = ["ANN"]

[tool.pytest.ini_options]
pythonpath = ["server/src", "."]
testpaths = ["server/src", "server/tests", "devtools", "tests", ".agents/hooks/tests", ".claude/hooks/tests"]
# importlib: los conftest.py y test_*.py de cada carpeta tienen nombres repetidos y no son paquetes.
addopts = "--doctest-modules --import-mode=importlib -m 'not local'"
markers = ["local: needs this machine's engine venvs (does not run in CI)"]
