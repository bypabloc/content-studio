name: sync-dev

# Tras cada push a main (merge de fix/* o de dev), abre un PR main → dev y lo deja en auto-merge.
# Usa SYNC_TOKEN (fine-grained: Contents + Pull requests, read/write) porque un PR creado con
# GITHUB_TOKEN no dispara el check requerido origen-permitido y quedaría bloqueado.
on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: sync-dev
  cancel-in-progress: false

jobs:
  pr-main-a-dev:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - name: Open PR main → dev (if dev is behind)
        run: |
          behind=$(gh api "repos/$REPO/compare/dev...main" --jq .ahead_by)
          if [ "$behind" = "0" ]; then
            echo "dev already contains main; nothing to sync."
            exit 0
          fi
          pr=$(gh pr list -R "$REPO" --base dev --head main --state open --json number --jq '.[0].number')
          if [ -z "$pr" ]; then
            pr=$(gh pr create -R "$REPO" --base dev --head main \
              --title "chore: sync dev with main" \
              --body "Automatic PR (sync-dev): brings to dev the $behind commit(s) of main it is missing, for example a hotfix \`fix/*\`. It is merged automatically when the checks pass; if there is a conflict, it stays open to resolve by hand." \
              | grep -o '[0-9]*$')
          fi
          gh pr merge "$pr" -R "$REPO" --merge --auto
          echo "PR #$pr set to auto-merge."

          # GitHub calcula mergeable de forma asíncrona: esperar hasta ~1 min a que deje de ser UNKNOWN.
          for _ in $(seq 1 12); do
            state=$(gh pr view "$pr" -R "$REPO" --json mergeable --jq .mergeable)
            [ "$state" != "UNKNOWN" ] && break
            sleep 5
          done
          if [ "$state" = "CONFLICTING" ]; then
            gh pr comment "$pr" -R "$REPO" --body "**Conflict between main and dev**: this PR will not merge by itself. To resolve it:

          \`\`\`bash
          git switch dev && git pull
          git switch -c fix/resolver-sync-main-dev
          git merge origin/main        # resolve the conflicts and commit
          git push -u origin fix/resolver-sync-main-dev
          gh pr create --base dev
          \`\`\`

          When that PR is merged into dev, this one closes by itself. See \`.claude/rules/git-workflow.md\`."
            echo "::error::PR #$pr (main → dev) has conflicts: they must be resolved by hand."
            exit 1
          fi
