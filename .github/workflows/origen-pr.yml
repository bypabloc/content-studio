name: origen-pr

# Restringe la rama de origen de los PR. Check requerido por los rulesets de main y dev.
# origen-permitido es el nombre del check que exigen los rulesets: no se renombra (cambiarlo obliga a tocar GitHub).
# cspell:ignore permitido
#   main ← dev, fix/*
#   dev  ← main (back-merge de hotfix) y los prefijos de DEV_PREFIXES
# Debe coincidir con .claude/rules/git-workflow.md.
on:
  pull_request:
    branches: [main, dev]
    types: [opened, reopened, synchronize, edited]

permissions: {}

jobs:
  origen-permitido:
    runs-on: ubuntu-latest
    steps:
      - name: Verify source branch
        env:
          SOURCE: ${{ github.head_ref }}
          TARGET: ${{ github.base_ref }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          DEV_PREFIXES: feature fix refactor docs test chore ci perf style experiment release
        run: |
          allowed=false
          if [ "$SAME_REPO" = "true" ]; then
            case "$TARGET" in
              main)
                { [ "$SOURCE" = "dev" ] || [[ "$SOURCE" == fix/* ]]; } && allowed=true ;;
              dev)
                [ "$SOURCE" = "main" ] && allowed=true
                for p in $DEV_PREFIXES; do [[ "$SOURCE" == "$p"/?* ]] && allowed=true; done ;;
            esac
          fi
          if [ "$allowed" = "true" ]; then
            echo "Allowed source: $SOURCE -> $TARGET"
          else
            echo "::error::$TARGET does not accept PRs from '$SOURCE'. See .claude/rules/git-workflow.md"
            exit 1
          fi
