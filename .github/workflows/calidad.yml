# cspell:ignore calidad
name: calidad

# test-runner --type=all (lint, spelling, validators, unit con cobertura y espejo, typecheck y tdd) y guard-tdd, en 3.10,
# el mínimo por el venv de CosyVoice, y 3.12 (spec 003, D-6). Sin GPU: los tests `local` no corren aquí.
# Es check requerido de dev (ruleset): el job se llama calidad, como exige el ruleset (ver DECISIONS ciclo 8).
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  calidad:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: oven-sh/setup-bun@v2
      # legacy: grabar/ (hasta la 007) importa rich y questionary, y el doctest de pytest lo importa.
      - run: uv sync --group dev --group legacy --python ${{ matrix.python }}
      - run: bun install --frozen-lockfile
      - run: uv run python -m devtools test-runner --type=all
      - run: uv run python -m devtools test-runner --type=guard-tdd
      - name: log de pytest si falla
        if: failure()
        run: tail -n 150 tmp/test-runner/pytest.log || true
