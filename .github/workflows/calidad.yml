# cspell:ignore calidad dtolnay swatinem
name: calidad

# test-runner --type=all (lint, spelling, validators, unit con cobertura y espejo, typecheck y tdd) y guard-tdd, en 3.10,
# el mínimo por el venv de CosyVoice, y 3.12 (spec 003, D-6). Sin GPU: los tests `local` no corren aquí.
# No corre en los PR de bypabloc, el único colaborador: su verificación es local, con los hooks de git (pre-commit y
# pre-push) y el shell_guard que impide saltarlos con --no-verify. Sí corre en los PR de otras personas y de Dependabot.
# Ya no es check requerido de dev: un job saltado no reporta los nombres de la matriz.
# cspell:ignore bypabloc
on:
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  calidad:
    if: github.event.pull_request.user.login != 'bypabloc'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: oven-sh/setup-bun@v2
      - run: uv sync --group dev --python ${{ matrix.python }}
      - run: bun install --frozen-lockfile
      # Las pruebas de tomas, importación y chequeo llaman a ffmpeg y ffprobe (spec 010): el runner no los trae.
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: uv run python -m devtools test-runner --type=all
      - run: uv run python -m devtools test-runner --type=guard-tdd
      - name: log de pytest si falla
        if: failure()
        run: tail -n 150 tmp/test-runner/pytest.log || true

  # Gates del client (spec 005, D-9): e2e necesita Chromium, así que no va en `all`. Sin el Python de la matriz: devtools
  # es stdlib.
  client:
    if: github.event.pull_request.user.login != 'bypabloc'
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run --cwd tests/e2e playwright install --with-deps chromium
      - run: uv run --no-project python -m devtools test-runner --type=e2e
      - name: upload the e2e report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-tmp
          path: tmp/e2e/

  # cargo check del crate de Tauri (D-9). En Windows: ubuntu no trae webkit2gtk. `generate_context!` necesita client/dist.
  tauri:
    if: github.event.pull_request.user.login != 'bypabloc'
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri
      - run: bun install --frozen-lockfile
      - run: bun run --cwd client build
      - run: uv run --no-project python -m devtools test-runner --type=tauri-check
      # La prueba de regresión del Job Object (server.rs) usa cmd, ping y PowerShell: solo corre en Windows.
      - run: cargo test --manifest-path client/src-tauri/Cargo.toml
