name: origen-pr-main

# main solo acepta PRs desde dev o desde ramas fix/*. Check requerido por el ruleset de main.
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited]

permissions: {}

jobs:
  origen-permitido:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar rama de origen
        env:
          ORIGEN: ${{ github.head_ref }}
          MISMO_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          if [ "$MISMO_REPO" = "true" ] && { [ "$ORIGEN" = "dev" ] || [[ "$ORIGEN" == fix/* ]]; }; then
            echo "Origen permitido: $ORIGEN"
          else
            echo "::error::main solo acepta PRs desde 'dev' o 'fix/*' de este repo (origen: $ORIGEN)"
            exit 1
          fi
