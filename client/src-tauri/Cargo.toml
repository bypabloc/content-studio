[package]
name = "content-studio"
version = "0.1.0"
description = "Content Studio: estudio de audio y video local"
edition = "2024"
publish = false

[lib]
name = "content_studio_lib"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "=2.7.6", features = [] }

[dependencies]
tauri = { version = "=2.12.7", features = [] }
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-opener = "=2.7.3"
tauri-plugin-notification = "=2.8.1"
tauri-plugin-window-state = "=2.5.0"
tauri-plugin-updater = "=2.14.1"
tauri-plugin-process = "=2.4.0"
tauri-plugin-deep-link = "=2.6.3"
tauri-plugin-single-instance = { version = "=2.5.5", features = ["deep-link"] }
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_System_Registry"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

