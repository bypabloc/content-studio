[package]
name = "content-studio"
version = "0.1.0"
description = "Content Studio: estudio de audio y video local"
edition = "2021"
publish = false

[lib]
name = "content_studio_lib"
path = "src/lib.rs"

[build-dependencies]
tauri-build = "=2.7.6"

[dependencies]
tauri = "=2.12.7"
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-opener = "=2.7.3"
tauri-plugin-notification = "=2.8.1"
tauri-plugin-window-state = "=2.5.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
getrandom = "=0.3.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects"] }
