[project]
name = "content-studio"
version = "0.1.0"
description = "Narración TTS y música de fondo locales para videos, en una GPU de 8 GB."
requires-python = ">=3.10"
# Las mismas que la cabecera PEP 723 de cli.py (tests/validators/test_estructura.py lo comprueba).
dependencies = ["typer>=0.29", "rich>=14", "questionary>=2.1"]

[project.scripts]
content-studio = "content_studio.cli.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/content_studio"]
