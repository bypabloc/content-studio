[project]
name = "content-studio"
version = "0.1.0"
description = "Local narration (TTS with voice cloning) and background music for videos, on an 8 GB GPU."
requires-python = ">=3.10"
# Las mismas que la cabecera PEP 723 de cli.py (tests/validators/test_structure.py lo comprueba).
dependencies = [
    "typer>=0.29",
    "rich>=14",
    "questionary>=2.1",
    "fastapi>=0.162.5",
    "uvicorn>=0.54.0",
]

[project.scripts]
content-studio = "content_studio.cli.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/content_studio"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]
