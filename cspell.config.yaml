# cspell de content-studio, adaptado de klinikae (spec 002, D-1). El código y los datos van en inglés. Lo que queda en
# español (docstrings, comentarios, docs y catálogos) no se revisa o se revisa con en,es. Diccionario propio:
# devtools/cspell/content-studio-terms.txt. Nunca agregar palabras en español ahí.
version: '0.2'
import:
  - '@cspell/dict-es-es/cspell-ext.json'
language: en
caseSensitive: false
minWordLength: 4
dictionaries:
  - content-studio-terms
dictionaryDefinitions:
  - name: content-studio-terms
    path: ./devtools/cspell/content-studio-terms.txt
    addWords: true
patterns:
  - name: python-docstring
    pattern: '/"""[\s\S]*?"""/g'
  - name: hash-comment
    pattern: '/#.*$/gm'
  - name: string-literal
    pattern: '/"[^"\n]*"|''[^'']*''/g'
ignoreRegExpList:
  - python-docstring
  - hash-comment
  # Rutas del repo en español (docs, datos, devtools): son nombres de archivo, no palabras.
  - '(?:server|docs|devtools)/[\w/.-]+'
overrides:
  # Los strings de los tests pueden estar en español (son datos de prueba, no identificadores).
  - filename: '**/tests/**'
    ignoreRegExpList:
      - string-literal
  # Textos para leer en voz alta y catálogos de datos: español permitido.
  - filename: 'server/data/narration/docs/scripts/**'
    language: en,es
  - filename: 'server/data/**/*.json'
    language: en,es
  # Alias del guion: nombres en español a propósito (narration/script_aliases.json, spec 002 D-5). Las formas sin
  # tilde no están en el diccionario es-es, así que van por palabra.
  - filename: 'server/src/content_studio/narration/script_aliases.json'
    language: en,es
    words: [emocion, enfasis, energica, dramatica]
  # Textos de error de la API en español (spec 004, D-5): catálogo de datos, como los de server/data.
  - filename: 'server/src/content_studio/messages/es.json'
    language: en,es
  # Cliente (spec 005, D-1): el catálogo y los comentarios van en español; los identificadores, en inglés.
  - filename: 'client/**'
    language: en,es
  # Los e2e (spec 005, D-6) llevan comentarios en español, como client/: sin el locale es, sus palabras fallan.
  - filename: 'tests/e2e/**'
    language: en,es
ignorePaths:
  # Temporal (D-3): la UI en español de grabar/ la retira la 010 (la CLI `studio` ya no la tiene).
  # Catálogo de voces: nombres propios y textos en español que el diccionario no trae (D-1, catálogos).
  - server/data/narration/voices/catalog.json
  # Prosa en español para el agente: configuración del plugin session-handoff (D-1).
  - .claude/session-handoff.json
  # La config no se revisa a sí misma: lista rutas en español de carpetas que aún no se traducen.
  - cspell.config.yaml
  # Guiones y salidas de prueba en español: son datos del test, no código (D-1, tests).
  - server/tests/integration/fixtures/*.json
  - server/tests/integration/fixtures/*.txt
  # grabar/ (legacy: rich y questionary, con la UI en español): la 010 la retira.
  - server/src/content_studio/narration/grabar/**
  # Dependencias, salidas, grafo y datos que no son código: no se revisan.
  - node_modules/**
  - graphify-out/**
  - tmp/**
  - out/**
  - logs/**
  - docs/**
  - '**/*.md'
  - bun.lock
  - uv.lock
  - '**/*.lock'
  - server/data/**/*.wav
  - server/data/**/*.m4a
  - server/data/**/*.mp3
  - server/data/**/*.txt
  - server/data/**/engines/**
  - server/data/**/models/**
  - server/data/**/.venv*/**
  - server/data/**/voces/*/**
  - server/data/**/voices/*/**
