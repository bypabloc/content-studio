# cspell de content-studio, adaptado de klinikae (spec 002, D-1). El código y los datos van en inglés. Lo que queda en
# español (docstrings, comentarios, docs y catálogos) no se revisa o se revisa con en,es. Diccionario propio:
# devtools/cspell/content-studio-terms.txt. Nunca agregar palabras en español ahí.
version: '0.2'
import:
  - '@cspell/dict-es-es/cspell-ext.json'
  - '@cspell/dict-pt-br/cspell-ext.json'
language: en
caseSensitive: false
minWordLength: 4
dictionaries:
  - content-studio-terms
dictionaryDefinitions:
  - name: content-studio-terms
    path: ./devtools/cspell/content-studio-terms.txt
    addWords: true
patterns:
  - name: python-docstring
    pattern: '/"""[\s\S]*?"""/g'
  - name: hash-comment
    pattern: '/#.*$/gm'
  - name: string-literal
    pattern: '/"[^"\n]*"|''[^'']*''/g'
ignoreRegExpList:
  - python-docstring
  - hash-comment
  # Rutas del repo en español (docs, datos, devtools): son nombres de archivo, no palabras.
  - '(?:server|docs|devtools)/[\w/.-]+'
overrides:
  # Los strings de los tests pueden estar en español (son datos de prueba, no identificadores).
  - filename: '**/tests/**'
    ignoreRegExpList:
      - string-literal
  # Textos para leer en voz alta y catálogos de datos: español permitido.
  - filename: 'server/data/narration/docs/scripts/**'
    language: en,es
  - filename: 'server/data/**/*.json'
    language: en,es
  # Alias del guion: nombres en español a propósito (narration/script_aliases.json, spec 002 D-5). Las formas sin
  # tilde no están en el diccionario es-es, así que van por palabra.
  - filename: 'server/src/content_studio/narration/script_aliases.json'
    language: en,es
    words: [emocion, enfasis, energica, dramatica]
  # Textos de error de la API en español (spec 004, D-5): catálogo de datos, como los de server/data.
  # «Masterización» (spec 006, D-2) es la opción de voz de «Avanzado»: va por palabra también aquí (spec 007, D-1).
  # Los nombres de idioma («Español», «Português») son iguales en los tres catálogos (spec 007, D-6): por palabra.
  - filename: 'server/src/content_studio/messages/es.json'
    language: en,es
    words: [desinstalación, masterización, minimalista, minimalistas, motivacional, celtic, christmas, saas, português, deutsch, français, renderizar, renderizando, bitrate, kbps, vorbis, youtube]
  # Catálogo en inglés (spec 007, D-9): sus nombres de idioma van por palabra.
  - filename: 'server/src/content_studio/messages/en.json'
    language: en
    words: [español, português, deutsch, français, italiano, bitrate, kbps, vorbis, youtube]
  # Catálogo en portugués de Brasil (spec 007, D-9): se revisa con su diccionario, como el español.
  - filename: 'server/src/content_studio/messages/pt.json'
    language: en,pt-br
    words: [celtic, christmas, saas, español, deutsch, français, bitrate, kbps, vorbis, youtube]
  # Nombres de códecs, filtros de ffmpeg y de pytest (spec 015, D-1 y T2): el catálogo y sus pruebas los usan tal cual.
  - filename: 'server/**/content_studio/media/**'
    words: [libmp, libopus, libvorbis, vorbis, libvpx, libsvtav, lanczos, palettegen, paletteuse, lavfi, pytestmark, boxblur, deesser, acompressor, anull, aout, vout, acrossfade, xfade, fltp, setsar, frombytes]
  # Tipos generados de la API (`gen:api`): sus descripciones vienen de los docstrings del server, en español.
  - filename: 'client/src/shared/api/schema.d.ts'
    language: en,es
    words: [replanifica, replanificar]
  # Linter del guion (spec 006, D-1): las reglas, sus palabras y sus patrones están en español (formato-guion.md).
  - filename: 'server/src/content_studio/narration/script_lint.py'
    language: en,es
  # Cliente (spec 005, D-1): el catálogo y los comentarios van en español; los identificadores, en inglés.
  # «Masterización» (spec 006, D-2) es la opción de voz de «Avanzado»: el diccionario es-es no la trae; va por palabra.
  - filename: 'client/**'
    language: en,es
    words: [masterización, renderiza, renderizar, replanifican, arrastrable, reusa, vorbis, youtube]
  # Los e2e (spec 005, D-6) llevan comentarios en español, como client/: sin el locale es, sus palabras fallan.
  - filename: 'tests/e2e/**'
    language: en,es
  # Moléculas de klinikae (spec 008, T3): docstrings en español con palabras que el diccionario es-es no trae.
  - filename: 'client/src/shared/components/molecules/**'
    language: en,es
    words: [autoselecciona, paginación, bloq, mayús, autocapitalización, seleccionables, prefirmadas, renderiza, intrusivos, tipados]
  # Organismos de klinikae (spec 008, T4): comentarios y títulos de prueba en español que el diccionario es-es no trae.
  - filename: 'client/**/components/organisms/**'
    language: en,es
    words: [animables, audiograma, editables, enfocable, milisegundos, montos, renderiza]
  # Formularios (spec 008, T4): useForm tiene comentarios en español; «recalcula» no está en el diccionario es-es.
  - filename: 'client/**/shared/forms/**'
    language: en,es
    words: [recalcula]
ignorePaths:
  # Catálogo de voces: nombres propios y textos en español que el diccionario no trae (D-1, catálogos).
  - server/data/narration/voices/catalog.json
  # Prosa en español para el agente: configuración del plugin session-handoff (D-1).
  - .claude/session-handoff.json
  # La config no se revisa a sí misma: lista rutas en español de carpetas que aún no se traducen.
  - cspell.config.yaml
  # Guiones y salidas de prueba en español: son datos del test, no código (D-1, tests).
  - server/tests/integration/fixtures/*.json
  - server/tests/integration/fixtures/*.txt
  # Golden del ASS (spec 014, AC-9): tags de formato y frases de prueba, no prosa.
  - server/tests/fixtures/subtitles/*.ass
  # Golden del grafo del editor (spec 017, D-4): nombres de filtros de ffmpeg, no prosa.
  - server/tests/fixtures/editor/*.filter
  # Código de proveedor copiado de klinikae (spec 008, D-1): se trae tal cual, con sus comentarios y sus clases.
  - client/src/shared/components/shadcn/**
  # Dependencias, salidas, grafo y datos que no son código: no se revisan.
  - node_modules/**
  - graphify-out/**
  - tmp/**
  - out/**
  - logs/**
  - docs/**
  - '**/*.md'
  - bun.lock
  - uv.lock
  - '**/*.lock'
  - server/data/**/*.wav
  - server/data/**/*.m4a
  - server/data/**/*.mp3
  - server/data/**/*.txt
  - server/data/**/engines/**
  - server/data/**/models/**
  - server/data/**/.venv*/**
  - server/data/**/voces/*/**
  - server/data/**/voices/*/**
